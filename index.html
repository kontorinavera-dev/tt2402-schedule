    /* =====================================================
       БЕЗОПАСНЫЙ ВЫВОД ТЕКСТА
       ===================================================== */

    function escapeHtml(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* =====================================================
       ДАТА
       ===================================================== */

    function formatDate(date) {

      return date.toLocaleDateString(
        "ru-RU",
        {
          day: "numeric",
          month: "long"
        }
      );

    }


    function formatDateInput(date) {

      const year =
        date.getFullYear();

      const month =
        String(date.getMonth() + 1)
          .padStart(2, "0");

      const day =
        String(date.getDate())
          .padStart(2, "0");

      return `${year}-${month}-${day}`;

    }


    function getTodayDay() {

      const day =
        new Date().getDay();

      /*
        JavaScript:
        0 = воскресенье
        1 = понедельник
        ...
        6 = суббота
      */

      return day;

    }


    function getWeekDates() {

      const today =
        new Date();

      today.setHours(0, 0, 0, 0);

      const jsDay =
        today.getDay();

      const mondayOffset =
        jsDay === 0
          ? -6
          : 1 - jsDay;

      const monday =
        new Date(today);

      monday.setDate(
        today.getDate() + mondayOffset
      );

      const dates = [];

      for (let i = 0; i < 6; i++) {

        const date =
          new Date(monday);

        date.setDate(
          monday.getDate() + i
        );

        dates.push(date);

      }

      return dates;

    }

          </div>

          <div class="lesson-subject">
            ${escapeHtml(subject)}
          </div>

          <div class="lesson-meta">

            <span class="tag">
              ${escapeHtml(type)}
            </span>

            <span class="tag room">
              Каб. ${escapeHtml(room)}
            </span>

          </div>

          <div class="lesson-teacher">
            ${escapeHtml(teacher)}
          </div>

        </article>

      `;

    }


    /* =====================================================
       ПУСТОЙ ДЕНЬ
       ===================================================== */

    function emptyHtml(
      text = "Занятий нет"
    ) {

      return `

        <div class="empty">

          <strong>
            Свободный день
          </strong>

          <span>
            ${escapeHtml(text)}
          </span>

        </div>

      `;

    }


    /* =====================================================
       САМОСТОЯТЕЛЬНАЯ ПОДГОТОВКА
       ===================================================== */

    function preparationHtml() {

      return `

        <div class="empty prep-card">

          <div class="icon">
            📚
          </div>

          <strong>
            День самостоятельной подготовки
          </strong>

          <span>
            Занятий по расписанию нет.
          </span>

        </div>

      `;

    }


    /* =====================================================
       СЕГОДНЯ
       ===================================================== */

    function renderToday() {

      const today =
        new Date();

      const day =
        getTodayDay();

      const data =
        schedule[day];

      let html = `

        <div class="date-strip">

          <div>

            <div class="date-title">
              ${
                data
                  ? data.name
                  : "Воскресенье"
              }
            </div>

            <div class="date-subtitle">
              ${formatDate(today)}
            </div>

          </div>

          <div class="today-pill">
            Сегодня
          </div>

        </div>

      `;


      if (day === 0) {

        html +=
          emptyHtml(
            "Сегодня воскресенье."
          );

      }

      else if (data && data.preparation) {

        html +=
          preparationHtml();

      }

      else if (
        !data ||
        !data.lessons ||
        data.lessons.length === 0
      ) {

        html +=
          emptyHtml();

      }

      else {

        html += `

          <div class="lesson-list">

            ${data.lessons
              .map(lessonHtml)
              .join("")}

          </div>

        `;

      }


      content.innerHTML =
        html;

    }


    /* =====================================================
       НЕДЕЛЯ
       ===================================================== */

    function renderWeek() {

      const dates =
        getWeekDates();

      let html = `

        <div class="date-strip">

          <div>

            <div class="date-title">
              Эта неделя
            </div>

            <div class="date-subtitle">
              ${formatDate(dates[0])}
              —
              ${formatDate(dates[5])}
            </div>

          </div>

        </div>

      `;


      dates.forEach(
        (date, index) => {

          const day =
            index + 1;

          const data =
            schedule[day];

          const isToday =
            date.toDateString() ===
            new Date().toDateString();

          let body = "";


          if (data && data.preparation) {

            body =
              preparationHtml();

          }

          else if (
            data &&
            data.lessons &&
            data.lessons.length
          ) {

            body = `

              <div class="lesson-list">

                ${data.lessons
                  .map(lessonHtml)
                  .join("")}

              </div>

            `;

          }

          else {

            body =
              emptyHtml();

          }


          html += `

            <section class="week-day">

              <div class="week-day-title">

                <h3>
                  ${escapeHtml(data.name)}
                  ${
                    isToday
                      ? " · сегодня"
                      : ""
                  }
                </h3>

                <span>
                  ${formatDate(date)}
                </span>

              </div>

              ${body}

            </section>

          `;

        }
      );


      content.innerHTML =
        html;

    }


    /* =====================================================
       ДОМАШНИЕ ЗАДАНИЯ
       ===================================================== */

    function getHomework() {

      try {

        const data =
          JSON.parse(
            localStorage.getItem(
              "tt2402-homework"
            ) || "[]"
          );

        return Array.isArray(data)
          ? data
          : [];

      }

      catch (error) {

        return [];

      }

    }


    function saveHomeworkList(list) {

      localStorage.setItem(
        "tt2402-homework",
        JSON.stringify(list)
      );

    }


    function renderHomework() {

      const list =
        getHomework().sort(
          (a, b) =>
            String(a.date)
              .localeCompare(
                String(b.date)
              )
        );


      let html = `

        <button
          class="add-btn"
          id="addHomework"
        >
          ＋ Добавить домашнее задание
        </button>

      `;


      if (list.length === 0) {

        html +=
          emptyHtml(
            "Здесь будут сохранённые домашние задания."
          );

      }

      else {

        html += `

          <div class="homework-list">

            ${list.map(item => `

              <article class="homework">

                <div class="homework-head">

                  <div class="homework-subject">
                    ${escapeHtml(item.subject)}
                  </div>

                  <div class="homework-date">
                    ${escapeHtml(item.date)}
                  </div>

                </div>

                <div class="homework-text">
                  ${escapeHtml(item.text)}
                </div>

                <div class="homework-actions">

                  <button
                    class="small-btn"
                    data-edit="${escapeHtml(item.id)}"
                  >
                    Изменить
                  </button>

                  <button
                    class="small-btn delete"
                    data-delete="${escapeHtml(item.id)}"
                  >
                    Удалить
                  </button>

                </div>

              </article>

            `).join("")}

          </div>

        `;

      }


      content.innerHTML =
        html;


      const addButton =
        document.getElementById(
          "addHomework"
        );

      if (addButton) {

        addButton.addEventListener(
          "click",
          () => openHomeworkModal()
        );

      }


      content
        .querySelectorAll("[data-edit]")
        .forEach(button => {

          button.addEventListener(
            "click",
            () => {

              openHomeworkModal(
                button.dataset.edit
              );

            }
          );

        });


      content
        .querySelectorAll("[data-delete]")
        .forEach(button => {

          button.addEventListener(
            "click",
            () => {

              const id =
                button.dataset.delete;

              const newList =
                getHomework().filter(
                  item =>
                    String(item.id) !==
                    String(id)
                );

              saveHomeworkList(
                newList
              );

              renderHomework();

            }
          );

        });

    }


    /* =====================================================
       О САЙТЕ
       ===================================================== */

    function renderAbout() {

      content.innerHTML = `

        <div class="about-card">

          <h2>
            ТТ-24-02
          </h2>

          <p>
            Это отдельный сайт с расписанием
            учебных занятий группы.
          </p>

          <p>
            Расписание хранится непосредственно
            в этом приложении.
          </p>

          <p>
            Домашние задания сохраняются
            локально на устройстве.
          </p>

          <p>
            Сайт можно установить на телефон
            как приложение.
          </p>

        </div>

      `;

    }


    /* =====================================================
       ОБЩИЙ РЕНДЕР
       ===================================================== */

    function render() {

      document
        .querySelectorAll(".nav-btn")
        .forEach(button => {

          button.classList.toggle(
            "active",
            button.dataset.tab === state.tab
          );

        });


      if (state.tab === "today") {

        renderToday();

      }

      else if (state.tab === "week") {

        renderWeek();

      }

      else if (state.tab === "homework") {

        renderHomework();

      }

      else if (state.tab === "about") {

        renderAbout();

      }

    }


    /* =====================================================
       МОДАЛЬНОЕ ОКНО Д/З
       ===================================================== */

    function openHomeworkModal(
      id = null
    ) {

      state.editingHomeworkId =
        id;

      const list =
        getHomework();

      const item =
        id !== null
          ? list.find(
              x =>
                String(x.id) ===
                String(id)
            )
          : null;


      document.getElementById(
        "modalTitle"
      ).textContent =
        item
          ? "Изменить домашнее задание"
          : "Новое домашнее задание";


      document.getElementById(
        "hwSubject"
      ).value =
        item
          ? item.subject
          : "";


      document.getElementById(
        "hwDate"
      ).value =
        item
          ? item.date
          : formatDateInput(
              new Date()
            );


      document.getElementById(
        "hwText"
      ).value =
        item
          ? item.text
          : "";


      modalBackdrop.classList.add(
        "show"
      );

    }


    function closeHomeworkModal() {

      state.editingHomeworkId =
        null;

      modalBackdrop.classList.remove(
        "show"
      );

    }


    /* =====================================================
       КНОПКИ НАВИГАЦИИ
       ===================================================== */

    document
      .querySelectorAll(".nav-btn")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            state.tab =
              button.dataset.tab;

            render();

            window.scrollTo({
              top: 0,
              behavior: "smooth"
            });

          }
        );

      });


    /* =====================================================
       КНОПКА "О САЙТЕ"
       ===================================================== */

    document
      .getElementById("infoBtn")
      .addEventListener(
        "click",
        () => {

          state.tab =
            "about";

          render();

          window.scrollTo({
            top: 0,
            behavior: "smooth"
          });

        }
      );


    /* =====================================================
       ЗАКРЫТИЕ МОДАЛЬНОГО ОКНА
       ===================================================== */

    document
      .getElementById("cancelModal")
      .addEventListener(
        "click",
        closeHomeworkModal
      );


    modalBackdrop.addEventListener(
      "click",
      event => {

        if (
          event.target ===
          modalBackdrop
        ) {

          closeHomeworkModal();

        }

      }
    );


    /* =====================================================
       СОХРАНЕНИЕ Д/З
       ===================================================== */

    document
      .getElementById("saveHomework")
      .addEventListener(
        "click",
        () => {

          const subject =
            document
              .getElementById(
                "hwSubject"
              )
              .value
              .trim();

          const date =
            document
              .getElementById(
                "hwDate"
              )
              .value;

          const text =
            document
              .getElementById(
                "hwText"
              )
              .value
              .trim();


          if (!subject || !text) {

            return;

          }


          const list =
            getHomework();

          const id =
            state.editingHomeworkId;


          if (id !== null) {

            const index =
              list.findIndex(
                item =>
                  String(item.id) ===
                  String(id)
              );


            if (index !== -1) {

              list[index] = {

                id:
                  list[index].id,

                subject:
                  subject,

                date:
                  date,

                text:
                  text

              };

            }

          }

          else {

            list.push({

              id:
                Date.now(),

              subject:
                subject,

              date:
                date,

              text:
                text

            });

          }


          saveHomeworkList(
            list
          );

          closeHomeworkModal();

          if (
            state.tab ===
            "homework"
          ) {

            renderHomework();

          }

        }
      );


    /* =====================================================
       ЗАПУСК
       ===================================================== */

    render();


    /* =====================================================
       SERVICE WORKER
       ===================================================== */

    if (
      "serviceWorker" in navigator
    ) {

      window.addEventListener(
        "load",
        () => {

          navigator.serviceWorker
            .register(
              "./sw.js"
            )
            .catch(
              error => {
                console.log(
                  "Service Worker error:",
                  error
                );
              }
            );

        }
      );

    }

  </script>

</body>
</html>
